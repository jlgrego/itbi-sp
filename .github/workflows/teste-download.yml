name: teste-download
on: workflow_dispatch

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar planilha de 2026 do Release
        run: |
          curl -sS -L -m 300 -o itbi_2026.xlsx "https://github.com/jlgrego/itbi-sp/releases/download/dados-2026/itbi_2026.xlsx"
          ls -lh itbi_2026.xlsx

      - name: Baixar planilha de 2025 do Release
        run: |
          curl -sS -L -m 300 -o itbi_2025.xlsx "https://github.com/jlgrego/itbi-sp/releases/download/dados-2025/itbi_2025.xlsx"
          ls -lh itbi_2025.xlsx
