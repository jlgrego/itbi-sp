name: Atualizar site

on:
  workflow_dispatch:
  schedule:
    # Dia 20 de cada mês, 9h (horário de Brasília). Ajuste se preferir outro dia.
    - cron: "0 12 20 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Gerar o site
        run: python scripts/gerar_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
